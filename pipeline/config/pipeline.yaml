# Pipeline 実行設定（feature 定義とは別。人が調整する運用パラメータ）

geocode:
  provider: gsi
  # auto = 駅マスタの「500m 圏に掛かる区市町村」の和集合（spec 0008）。駅を増やしても手直し不要。
  # 区市町村リストを書けば固定の範囲になる。
  scope: auto
  # 区市町村をまたぐデータセットの組織（都立公園など）は常に対象
  extra: [東京都建設局]

dedupe:
  # 同名（正規化後）かつこの距離以内の施設は同一とみなす（複数データセットへの重複掲載対策）
  max_distance_m: 150

coverage:
  # 区市町村の位置不明施設がこの割合以下なら「揃っている」とみなす（spec 0005）。
  # 500m 圏（約 0.79km²）は区の面積の 1 割未満のため、5% の位置不明が圏内に入る期待値は通常 1 件未満。
  # 許容した件数は evidence に残し UI に表示する。
  unlocated_tolerance: 0.05
